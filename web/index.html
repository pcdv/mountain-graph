<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MountainGraph</title>
  <link rel="stylesheet" href="css/app.css">
  <!-- three.js, pinned: the only dependency, loaded when the 3D view is first shown -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header>
    <h1>MountainGraph</h1>
    <label class="button">Open a profile… <input id="picker" type="file" accept=".json,.gz,application/json"></label>
  </header>
  <main id="main">
    <p class="muted">Drop a profile here: the JSON of jfr-web (<code>/api/sessions/:id/profile</code>, or
      <code>profile.json</code> in a static export), gzipped or not.</p>
  </main>
</body>
</html>
