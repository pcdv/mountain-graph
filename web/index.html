<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MountainGraph</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/help.css">
  <!-- three.js, pinned: the only dependency, loaded when the 3D view is first shown -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- one row, in this order whatever the width: the app, the file, how it is shown, the actions -->
  <header>
    <h1>
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2.5 12c0-5 4.3-8.5 9.5-8.5s9.5 3.6 9.5 8.3c0 5.2-4.4 8.7-9.6 8.7S2.5 17 2.5 12z"/>
        <path d="M6.5 12.3c0-3 2.4-5.3 5.5-5.3s5.4 2.2 5.4 5c0 3-2.5 5.1-5.6 5.1-3 0-5.3-1.8-5.3-4.8z"/>
        <path d="M10 12.2c0-1.2.9-2 2-2s2 .8 2 1.9-.9 2-2.1 2c-1.1 0-1.9-.8-1.9-1.9z"/>
      </svg>
      MountainGraph
    </h1>
    <div id="bar"></div>
    <div id="tools"></div>
    <a id="help" class="button icon" href="help.html" target="_blank" title="Help (?)" aria-label="Help">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M6.2 6.3a1.9 1.9 0 1 1 2.7 1.7c-.6.3-.9.7-.9 1.3M8 11.4v.1"/></svg>
    </a>
    <button id="settings-toggle" class="button" type="button" aria-controls="settings" title="Settings of the view">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h7M13 4h1M2 12h1M7 12h7"/><circle cx="11" cy="4" r="2"/><circle cx="5" cy="12" r="2"/></svg>
      <span>Settings</span>
    </button>
    <label class="button primary">Open… <input id="picker" type="file"></label>
    <button id="close" class="button icon" type="button" hidden title="Close the file" aria-label="Close the file">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </header>
  <div id="timeline" hidden></div>
  <div id="workspace">
    <main id="main"></main>
    <aside id="settings" hidden aria-label="Settings">
      <div class="settings-head">
        <h2>Settings</h2>
        <button class="button icon close" type="button" title="Close the settings" aria-label="Close the settings">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <div id="settings-body"></div>
    </aside>
  </div>
  <!-- shown while no file is open (landing.js) -->
  <template id="landing">
    <div class="landing">
      <h2>Open a profile or a heap dump</h2>
      <p class="muted">Pick a file with the button above, or drop it anywhere on the page. It is read here, in the
        browser: nothing is sent anywhere. Files are recognized from their content, not their name.</p>

      <h2 class="profiles">Profiles</h2>
      <section class="kind profiles">
        <h3>JFR recordings (.jfr)</h3>
        <p>Recordings of JDK 11 and later, gzipped or not. Wall-clock samples and allocations are both read;
          you can switch between both modes from the top bar.</p>
      </section>
      <section class="kind profiles">
        <h3>Collapsed stacks</h3>
        <p>The text format of
          <a href="https://github.com/brendangregg/FlameGraph" target="_blank" rel="noopener">FlameGraph</a>'s
          stackcollapse scripts (<code>a;b;c 12</code> per line), which any profiler can produce.</p>
      </section>

      <h2 class="heap">Heap dumps</h2>
      <section class="kind heap">
        <h3>Heap dumps (.hprof)</h3>
        <p>Produced by jmap, jcmd or the JVM itself. It is parsed in-browser with
          <a href="https://github.com/pcdv/jheap" target="_blank" rel="noopener">jheap</a>'s parser.
          If the dump is too big (more than 100M objects) prefer using <code>jheap</code> directly to produce 
          a smaller file in the Flamepack format. Parsing is faster from the command line than from the browser.
          </p>
      </section>

      <h2 class="flamepack">Flamepack</h2>
      <p class="flamepack-intro muted">Collapsed stacks packed with a string dictionary, and enriched with each sample's
        time, thread and operation: <code>.flamepack.json</code>, gzipped or not
        (<a href="https://github.com/pcdv/flamepack" target="_blank" rel="noopener">the format</a>). Written by:</p>
      <section class="kind flamepack">
        <h3>jfr-web: time samples <span class="chip profiles">time</span></h3>
        <p>A session's profile as <a href="https://github.com/pcdv/jfr-web" target="_blank" rel="noopener">jfr-web</a>
          serves it (<code>/api/sessions/:id/profile</code>), or from one of its static exports. Operations, such as
          requests, become roots of the flame graph and lines of the timeline.</p>
      </section>
      <section class="kind flamepack">
        <h3>jfr-web: allocations <span class="chip heap">memory</span></h3>
        <p>The allocation samples of a session (<code>/api/sessions/:id/profile?samples=alloc</code>), weighing the
          bytes they stand for, the class allocated on top of each stack.</p>
      </section>
      <section class="kind flamepack">
        <h3>jheap: a heap <span class="chip heap">memory</span></h3>
        <p>The parse that the <code>jheap</code> command of
          <a href="https://github.com/pcdv/jheap" target="_blank" rel="noopener">jheap</a> keeps beside a dump,
          <code>&lt;name&gt;.jheap.json</code>, or writes with <code>--save</code>; a heap exported by this page too.
          Open it as you would the dump.</p>
      </section>
      <section class="kind flamepack">
        <h3>Your own tool <span class="chip profiles">time</span> <span class="chip heap">memory</span></h3>
        <p>Nothing in the format is specific to Java: any profiler, or a converter from another format, can write
          it. <a href="https://github.com/pcdv/flamepack/blob/master/SPEC.md#a-minimal-document" target="_blank"
          rel="noopener">A minimal document</a> needs only stacks and weights.</p>
      </section>
    </div>
  </template>
  <div id="progress" hidden>
    <div class="progress-text"></div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
  </div>
</body>
</html>
